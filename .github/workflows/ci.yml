name: Build

on: [push]

env:
  MSRV: "1.82.0"

jobs:
  test:
    name: Test (${{ matrix.toolchain }} / ${{ matrix.target || matrix.os || 'ubuntu-latest' }}${{ contains(matrix.args, '--no-default-features') && ' / no-std' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Host tests
          - toolchain: msrv
            args: --workspace
          - toolchain: stable
            args: --workspace
          - toolchain: stable
            os: macos-latest
            args: --workspace
          - toolchain: stable
            os: windows-latest
            args: --workspace
          - toolchain: stable
            os: ubuntu-24.04-arm
            args: --workspace
          - toolchain: beta
            args: --workspace
          - toolchain: nightly
            args: --workspace --all-features

          # No-std
          - toolchain: stable
            args: --workspace --no-default-features
          - toolchain: stable
            target: thumbv7em-none-eabihf
            args: --package multiversion --no-default-features

          # Stable cross targets
          - toolchain: stable
            target: i686-unknown-linux-gnu
            args: --package multiversion --tests
          - toolchain: stable
            target: loongarch64-unknown-linux-gnu
            args: --package multiversion --tests
          - toolchain: stable
            target: s390x-unknown-linux-gnu
            args: --package multiversion --tests

          # Nightly cross targets
          - toolchain: nightly
            target: armv7-unknown-linux-gnueabihf
            args: --package multiversion --features nightly --tests
          - toolchain: nightly
            target: powerpc-unknown-linux-gnu
            args: --package multiversion --features nightly --tests
          - toolchain: nightly
            target: powerpc64-unknown-linux-gnu
            args: --package multiversion --features nightly --tests
          - toolchain: nightly
            target: riscv64gc-unknown-linux-gnu
            args: --package multiversion --features nightly --tests

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@v7
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain == 'msrv' && env.MSRV || matrix.toolchain }}
        targets: ${{ matrix.target || '' }}
    - name: Check
      run: cargo check --verbose ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: Test
      if: matrix.target == ''
      run: cargo test --verbose ${{ matrix.args }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy, rustfmt
    - name: Clippy lint
      run: cargo clippy --all-features --all-targets -- -D warnings
    - name: Clippy lint no-std
      run: cargo clippy --no-default-features --all-targets -- -D warnings
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Deadlinks
      run: |
        cargo install cargo-deadlinks
        cargo doc
        cargo deadlinks -v --check-http
